server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Este contenedor va detrás de un proxy que termina TLS y le reenvía
    # todo por HTTP en el puerto 80. Sin esto, cuando nginx agrega la "/"
    # final a una ruta como /servicios (porque existe como directorio
    # prerenderizado servicios/index.html), arma la redirección con el
    # esquema que él mismo ve (http) en vez del que usó el visitante
    # (https), generando un salto HTTPS -> HTTP -> HTTPS en cada página
    # del sitio excepto el home. absolute_redirect off hace que nginx
    # devuelva un Location relativo ("/servicios/") en vez de uno absoluto,
    # así el navegador/crawler lo resuelve con el esquema con el que ya
    # está conectado y el salto inseguro desaparece.
    absolute_redirect off;

    # Compresión: el proxy delante de este contenedor solo comprime text/html;
    # sin esto, todo el JS/CSS del bundle (con hash en el nombre, varios cientos
    # de KB) viaja sin comprimir en cada visita.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad básicas (no afectan SEO directamente, pero las
    # auditorías de confiabilidad de Lighthouse/crawlers sí las revisan).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los bundles de Angular llevan hash de contenido en el nombre
    # (outputHashing: all en angular.json), así que un cambio de contenido
    # siempre genera un archivo nuevo: es seguro cachearlos "para siempre".
    location ~* \.(?:js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Las imágenes en public/ y src/assets/images no llevan hash en el nombre,
    # así que una caché larga arriesgaría servir una versión vieja tras un
    # deploy; una semana es un balance razonable.
    location ~* \.(?:jpg|jpeg|png|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Rutas que solo existen del lado del cliente (dependen de un token en la
    # URL, no tienen HTML prerenderizado propio): deben seguir sirviendo el
    # shell con 200, a diferencia de una ruta que de verdad no existe.
    location = /login {
        try_files $uri /index.csr.html;
    }
    location = /reset-password {
        try_files $uri /index.csr.html;
    }
    location = /users/verify {
        try_files $uri /index.csr.html;
    }
    # Panel de administración (super_admin): sin HTML propio, requiere sesión
    # -se resuelve en el navegador, ver superAdminGuard-, así que igual que
    # las rutas de arriba sirve el shell con 200 para cualquier subruta.
    location /admin {
        try_files $uri /index.csr.html;
    }

    # /guias y /noticias se renderizan en el momento (RenderMode.Server, ver
    # app.routes.server.ts) por un contenedor Node aparte -no hay HTML
    # prerenderizado de estas rutas en /usr/share/nginx/html-, para que una
    # entrada publicada desde /admin aparezca sin esperar un rebuild.
    location /guias {
        proxy_pass http://peajemx-frontend-ssr:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /noticias {
        proxy_pass http://peajemx-frontend-ssr:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Generado por el mismo contenedor SSR a partir de Mongo (ver
    # app-angular/src/server.ts) en vez de ser un archivo estático: así
    # incluye contenido publicado después del último build.
    location = /sitemap.xml {
        proxy_pass http://peajemx-frontend-ssr:4000;
        proxy_set_header Host $host;
    }

    # Cualquier otra ruta: si no hay un archivo/directorio prerenderizado que
    # coincida, es un 404 real (typo, enlace roto, URL vieja) y debe
    # responder como tal -aunque el cuerpo siga siendo el shell de Angular,
    # que se encarga de mostrar un estado "no encontrado"-, en vez del 200
    # genérico ("soft 404") que confunde a los crawlers y desperdicia
    # presupuesto de rastreo.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.csr.html;
}
