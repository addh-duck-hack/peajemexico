services:
  peajemx-frontend:
    build:
      context: .
      dockerfile: ./app-angular/Dockerfile
      target: nginx-runtime
    container_name: peajemx-frontend
    restart: always
    networks:
      - npm
      - peajemx-frontend-net
  # Renderiza /guias y /noticias en el momento de cada visita (ver
  # app-angular/src/app/app.routes.server.ts y app-angular/src/server.ts) en
  # vez de en build time: con frontend y backend construyéndose juntos en
  # este mismo docker-compose, el backend todavía no existe como contenedor
  # cuando se construye la imagen del frontend, así que un build que necesite
  # consultarlo por red siempre fallaba. peajemx-frontend (nginx, arriba) le
  # reenvía específicamente /guias y /noticias -ver nginx.conf-; el resto del
  # sitio se sigue sirviendo estático exactamente igual que antes.
  peajemx-frontend-ssr:
    build:
      context: .
      dockerfile: ./app-angular/Dockerfile
      target: ssr-runtime
    container_name: peajemx-frontend-ssr
    restart: always
    environment:
      # Dominios permitidos para el header Host de las peticiones que le
      # reenvía nginx (protección SSRF de @angular/ssr); sin esto, cada
      # visita a /guias o /noticias cae de vuelta a un shell sin contenido
      # server-rendered. Se lee de un .env en la raíz del proyecto (ver
      # .env.example) -si no existe ese archivo, usa el default de abajo.
      NG_ALLOWED_HOSTS: "${NG_ALLOWED_HOSTS:-peajesmx.com,www.peajesmx.com}"
      # Por defecto @angular/ssr NO confía en x-forwarded-for (solo en
      # x-forwarded-host y x-forwarded-proto) y cae al mismo shell sin
      # contenido si lo recibe sin haberlo confiado explícitamente -esto es
      # lo que realmente rompía /guias y /noticias en producción, confirmado
      # en los logs de este contenedor ("... but trustProxyHeaders was not
      # set up to allow it"). nginx.conf ya limpia X-Forwarded-Scheme (un
      # header que Nginx Proxy Manager agrega y que Angular ni reconoce).
      # Fijo aquí (no en .env): está acoplado 1:1 a los proxy_set_header de
      # nginx.conf, si se edita uno sin el otro se reintroduce el bug.
      NG_TRUST_PROXY_HEADERS: "x-forwarded-for,x-forwarded-proto"
    networks:
      - peajemx-frontend-net
      - peajemx-services-net
  peajemx-services:
    build: ./backend
    container_name: peajemx-services
    restart: always
    networks:
      - npm
      - peajemx-services-net

networks:
  peajemx-frontend-net:
    name: peajemx-frontend-net
    driver: bridge
  peajemx-services-net:
    name: peajemx-services-net
    driver: bridge
  npm:
    external: true
