services:
  peajemx-frontend:
    build:
      context: .
      dockerfile: ./app-angular/Dockerfile
    container_name: peajemx-frontend
    restart: always
    networks:
      - npm
  peajemx-services:
    build: ./backend
    container_name: peajemx-services
    restart: always
    networks:
      - npm

networks:
  npm:
    external: true
