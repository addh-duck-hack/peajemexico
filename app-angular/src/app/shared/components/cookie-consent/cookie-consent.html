@if (visible()) {
  <div
    class="fixed inset-x-0 bottom-0 z-50 border-t border-[var(--color-border)] bg-[var(--color-surface)] shadow-lg"
    role="dialog"
    aria-live="polite"
    aria-label="Aviso de cookies">
    <div class="max-w-screen-xl mx-auto px-4 md:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center gap-4">
      <p class="text-sm text-[var(--color-ink-soft)] flex-1">
        Usamos cookies propias y de terceros para medir el uso del sitio y mostrar publicidad. Puedes aceptarlas o
        rechazarlas; consulta más detalles en nuestro
        <a routerLink="/privacidad" class="text-[var(--color-accent)] hover:underline">aviso de privacidad</a>.
      </p>
      <div class="flex gap-3 shrink-0">
        <button
          type="button"
          (click)="reject()"
          class="px-4 py-2 text-sm font-semibold rounded-lg border border-[var(--color-border)] text-[var(--color-ink)] hover:bg-[var(--color-surface-alt)] transition-colors">
          Rechazar
        </button>
        <button
          type="button"
          (click)="accept()"
          class="px-4 py-2 text-sm font-semibold rounded-lg text-[var(--color-ink-invert)] bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] transition-colors">
          Aceptar
        </button>
      </div>
    </div>
  </div>
}
