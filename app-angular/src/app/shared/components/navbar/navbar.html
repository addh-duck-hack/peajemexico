<div class="antialiased">
  <div class="w-full text-main background-navbar">
    <div class="flex flex-col max-w-screen-xl px-4 mx-auto md:items-center md:justify-between md:flex-row md:px-6 lg:px-8">
      <div class="flex flex-row items-center justify-between p-4">
        <a href="/" class="flex items-center gap-2">
          <img [src]="logo" alt="{{ env.companyName }}" class="h-9 w-9" />
          <span class="text-lg font-bold tracking-tight" style="font-family: var(--font-display);">{{ env.companyName }}</span>
        </a>
        <button class="rounded-lg md:hidden focus:outline-none focus:shadow-outline" (click)="toggleMenuMobile()">
          <svg fill="currentColor" viewBox="0 0 20 20" class="w-6 h-6">
          @if (openMobile()) {
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          }@else {
            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z" clip-rule="evenodd"></path>
          }
          </svg>
        </button>
      </div>
      <nav
        [class]="classMobileMenu()"
      >
        @for (item of menuOptions; track item.id) {
          <a
            [routerLink]="item.route"
            [routerLinkActiveOptions]="{exact: true}"
            routerLinkActive="background-selected"
            class="px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg md:mt-0 md:ml-4 cursor-pointer hover:text-[var(--color-accent)]">
            {{item.name}}
          </a>
        }
        @if (sessionUser(); as session) {
          <div class="flex items-center gap-3 mt-3 md:mt-0 md:ml-4">
            @if (session.user.role === 'super_admin') {
              <a
                routerLink="/admin"
                class="text-sm font-semibold text-main hover:text-[var(--color-accent)] transition-colors">
                Admin
              </a>
            }
            <span class="text-sm font-semibold text-main">Hola, {{ session.user.name }}</span>
            <button
              type="button"
              (click)="logout()"
              title="Cerrar sesión"
              aria-label="Cerrar sesión"
              class="text-base text-main hover:text-[var(--color-accent)] transition-colors">
              <i class="fa-solid fa-power-off"></i>
            </button>
          </div>
        } @else if (onCalculatorRoute()) {
          <a
            routerLink="/login"
            class="mt-3 md:mt-0 md:ml-4 px-4 py-2 text-sm font-semibold text-center rounded-lg text-[var(--color-ink-invert)] bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] transition-colors">
            Iniciar sesión
          </a>
        } @else {
          <a
            routerLink="/calcular-mi-ruta"
            class="mt-3 md:mt-0 md:ml-4 px-4 py-2 text-sm font-semibold text-center rounded-lg text-[var(--color-ink-invert)] bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] transition-colors">
            Calcular mi ruta
          </a>
        }
      </nav>
    </div>
  </div>
</div>
