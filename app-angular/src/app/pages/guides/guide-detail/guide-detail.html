<navbar />

@if (article(); as article) {
  <main class="bg-[var(--color-bg)]">
    <section class="border-b border-[var(--color-border)]">
      <div class="max-w-screen-xl mx-auto px-4 md:px-6 lg:px-8 py-10 md:py-14">
        <a routerLink="/guias" class="text-sm font-semibold text-[var(--color-accent)] hover:text-[var(--color-accent-hover)]">
          &larr; Todas las guías
        </a>
        <h1 class="mt-4 text-2xl md:text-3xl font-bold text-[var(--color-ink)] max-w-3xl">{{ article.title }}</h1>
        <span class="mt-2 block text-sm text-[var(--color-ink-soft)]">
          {{ article.publishedDate }} &middot; {{ article.readingMinutes }} min de lectura
        </span>
      </div>
    </section>

    <section class="max-w-screen-xl mx-auto px-4 md:px-6 lg:px-8 py-10 md:py-14">
      <div class="max-w-3xl article-content text-[var(--color-ink-soft)]" [innerHTML]="article.contentHtml"></div>

      @if (otherArticles().length > 0) {
        <div class="max-w-3xl mt-14 pt-10 border-t border-[var(--color-border)]">
          <h2 class="text-lg font-semibold text-[var(--color-ink)]">Sigue leyendo</h2>
          <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
            @for (other of otherArticles(); track other.slug) {
              <a
                [routerLink]="['/guias', other.slug]"
                class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 hover:border-[var(--color-accent)] transition-colors">
                <span class="text-sm font-semibold text-[var(--color-ink)]">{{ other.title }}</span>
              </a>
            }
          </div>
        </div>
      }
    </section>
  </main>
}

<main-footer />
